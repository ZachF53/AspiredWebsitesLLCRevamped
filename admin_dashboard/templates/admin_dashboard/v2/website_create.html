{% extends "admin_dashboard/base.html" %}

{% block title %}Create Website — Admin v2{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-page-header">
        <div>
            <span class="eyebrow">v2 · Website</span>
            <h1 class="admin-page-title">Create website</h1>
            <p class="admin-page-sub">Tag it to an account and pick how it's built.</p>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card__body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Account <span class="required">*</span></label>
                    <select name="account_id" class="form-control" required>
                        <option value="">— Select an account —</option>
                        {% for acc in accounts %}
                            <option value="{{ acc.id }}"{% if acc.id|stringformat:"s" == selected_account_id %} selected{% endif %}>
                                {{ acc.name }}{% if acc.user.email %} ({{ acc.user.email }}){% endif %}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Website name <span class="required">*</span></label>
                    <input class="form-control" name="name" value="{{ name }}" required>
                </div>
                <div class="form-group">
                    <label>Build platform</label>
                    <select name="build_platform" class="form-control">
                        <option value="custom"{% if build_platform == 'custom' or not build_platform %} selected{% endif %}>Custom build — Aspired-hosted (Droplet)</option>
                        <option value="wordpress"{% if build_platform == 'wordpress' %} selected{% endif %}>WordPress — client-hosted (no Droplet)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary btn-sm">Create website</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
