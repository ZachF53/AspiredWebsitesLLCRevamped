{% extends "admin_dashboard/base.html" %}

{% block title %}Create Account — Admin v2{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-page-header">
        <div>
            <span class="eyebrow">v2 · Account</span>
            <h1 class="admin-page-title">Create account</h1>
            <p class="admin-page-sub">Records only — creates an inactive login and an account row. Sends nothing.</p>
        </div>
    </div>

    <div class="admin-card">
        <div class="admin-card__body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Account name <span class="required">*</span></label>
                    <input class="form-control" name="name" value="{{ name }}" required>
                </div>
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input class="form-control" type="email" name="email" value="{{ email }}" required>
                </div>
                <div class="form-group">
                    <label>Contact name</label>
                    <input class="form-control" name="contact_name" value="{{ contact_name }}">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input class="form-control" name="phone" value="{{ phone }}">
                </div>
                <button type="submit" class="btn-primary btn-sm">Create record</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
